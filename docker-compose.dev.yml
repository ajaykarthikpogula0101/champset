services:
  db:
    image: postgres:16-alpine
    ports:
      - "55433:5432"
    environment:
      POSTGRES_USER: bigset
      POSTGRES_PASSWORD: bigset
      POSTGRES_DB: bigset_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bigset -d bigset_internal"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

  convex:
    image: ghcr.io/get-convex/convex-backend:latest
    ports:
      - "3210:3210"
      - "3211:3211"
    volumes:
      - convex_data:/convex/data
    entrypoint: /convex/run_backend.sh
    environment:
      CONVEX_CLOUD_ORIGIN: http://127.0.0.1:3210
      CONVEX_SITE_ORIGIN: http://127.0.0.1:3211
      POSTGRES_URL: postgresql://bigset:bigset@db:5432
      DO_NOT_REQUIRE_SSL: 1
      INSTANCE_NAME: convex-self-hosted
      RUST_LOG: info
      DISABLE_BEACON: true
      DISABLE_METRICS_ENDPOINT: true
    depends_on:
      db:
        condition: service_healthy

  convex-dashboard:
    image: ghcr.io/get-convex/convex-dashboard:latest
    ports:
      - "6791:6791"
    environment:
      NEXT_PUBLIC_DEPLOYMENT_URL: http://127.0.0.1:3210
      # Pre-fills the login form's admin key. Read at request time by the
      # dashboard's server-side getInitialProps (a container recreate is enough).
      # The upstream self-hosted dashboard has no true auto-login at runtime —
      # NEXT_PUBLIC_USE_CURRENT_DEPLOYMENT_API is baked in at image build time —
      # so this reduces opening the dashboard to a single "Log In" click.
      NEXT_PUBLIC_ADMIN_KEY: ${CONVEX_SELF_HOSTED_ADMIN_KEY:-}
    depends_on:
      convex:
        condition: service_started

  searxng:
    image: searxng/searxng:latest
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      SEARXNG_BASE_URL: http://localhost:8080/
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    env_file:
      - .env
    ports:
      - "3501:3501"
    volumes:
      - ./backend/src:/app/src
      - ./scripts:/scripts:ro
    # LakeStream runs outside this compose. Inside the container `localhost`
    # is the container itself, so reach a host-run LakeStream via
    # host.docker.internal (host-gateway makes this work on Linux too).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_OPTIONS: --no-network-family-autoselection
      CLIENT_ORIGIN: http://localhost:3500
      CONVEX_URL: http://convex:3210
      PORT: 3501
      CONVEX_SELF_HOSTED_ADMIN_KEY: ${CONVEX_SELF_HOSTED_ADMIN_KEY:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ADMIN_USER_IDS: ${ADMIN_USER_IDS:-}
      SEARXNG_URL: http://searxng:8080
      # Override with LAKESTREAM_URL_DOCKER when LakeStream is reachable on
      # another host or a shared compose network.
      LAKESTREAM_URL: ${LAKESTREAM_URL_DOCKER:-http://host.docker.internal:3001}
      LAKESTREAM_API_KEY: ${LAKESTREAM_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-ChampSet <noreply@championsmail.com>}
      POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
      POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://us.i.posthog.com}
      REFRESH_SCHEDULER_ENABLED: ${REFRESH_SCHEDULER_ENABLED:-true}
      REFRESH_SCHEDULER_POLL_MS: ${REFRESH_SCHEDULER_POLL_MS:-60000}
      REFRESH_SCHEDULER_BATCH_SIZE: ${REFRESH_SCHEDULER_BATCH_SIZE:-5}
      REFRESH_SCHEDULER_STALE_AFTER_MS: ${REFRESH_SCHEDULER_STALE_AFTER_MS:-21600000}
    depends_on:
      convex:
        condition: service_started
      searxng:
        condition: service_started

  mastra:
    build:
      context: ./backend
      dockerfile: Dockerfile.mastra
    env_file:
      - .env
    ports:
      - "4111:4111"
    volumes:
      - ./backend/src:/app/src
      - ./scripts:/scripts:ro
    environment:
      NODE_OPTIONS: --no-network-family-autoselection
      HOST: 0.0.0.0
      PORT: 4111
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      CONVEX_URL: http://convex:3210
      CONVEX_SELF_HOSTED_ADMIN_KEY: ${CONVEX_SELF_HOSTED_ADMIN_KEY:-}
      SEARXNG_URL: http://searxng:8080
    depends_on:
      convex:
        condition: service_started
      searxng:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    env_file:
      - .env
    ports:
      - "3500:3500"
    volumes:
      - ./frontend/app:/app/app
      - ./frontend/lib:/app/lib
      - ./frontend/components:/app/components
      - ./frontend/public:/app/public
      - ./frontend/convex:/app/convex
      - ./frontend/proxy.ts:/app/proxy.ts
      - ./frontend/next.config.ts:/app/next.config.ts
      - ./scripts:/scripts:ro
    environment:
      NEXT_PUBLIC_CONVEX_URL: http://localhost:3210
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
      NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL: /dashboard
      NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL: /dashboard
      NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL: /dashboard
      NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL: /dashboard
      NEXT_PUBLIC_BACKEND_URL: http://localhost:3501
      NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
      NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://us.i.posthog.com}
    depends_on:
      convex:
        condition: service_started

volumes:
  pgdata:
  convex_data:



